server {
    listen 80;
    server_name isuremedia.com www.isuremedia.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name isuremedia.com www.isuremedia.com;

    ssl_certificate     /etc/nginx/ssl/cloudflare-origin.pem;
    ssl_certificate_key /etc/nginx/ssl/cloudflare-origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    root /usr/share/nginx/html/static;
    index index.html;

    add_header X-Frame-Options          "SAMEORIGIN"                       always;
    add_header X-Content-Type-Options   "nosniff"                          always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin"  always;
    add_header Permissions-Policy       "geolocation=(), camera=(), microphone=()" always;

    location = /blog      { return 302 https://blogs.isuremedia.com; }
    location /blog/       { rewrite ^/blog/(.*)$ https://blogs.isuremedia.com/$1 redirect; }
    location = /freetools { return 302 https://templates.isuremedia.com/; }

    location ~ ^/about-us/?$                                { return 301 /about; }
    location ~ ^/isuremedias-certifications/?$              { return 301 /about; }
    location ~ ^/web-solutions/?$                           { return 301 /websites-and-funnels; }
    location ~ ^/web-development-services/?$                { return 301 /wordpress-development-services; }
    location ~ ^/web-application-development-services/?$    { return 301 /websites-and-funnels; }
    location ~ ^/web-integration-services/?$                { return 301 /api-integration-services; }
    location ~ ^/digital-marketing-services/?$              { return 301 /services; }
    location ~ ^/ppc-services/?$                            { return 301 /ppc-marketing-agencies; }
    location ~ ^/global-seo-agency/?$                       { return 301 /seo-services; }
    location ~ ^/social-media-management-services/?$        { return 301 /content-marketing-and-creative-agency; }
    location ~ ^/brand-building-agency/?$                   { return 301 /brand-identity-design-services; }
    location ~ ^/video-editing-service/?$                   { return 301 /video-editing-services; }
    location ~ ^/content-writing-services/?$                { return 301 /content-marketing-and-creative-agency; }
    location ~ ^/marketing-automation-services/?$           { return 301 /marketing-automation-agency; }
    location ~ ^/kajabi-expert/?$                           { return 301 /kajabi-website-development; }
    location ~ ^/hire-clickfunnel-expert/?$                 { return 301 /clickfunnels-development; }
    location ~ ^/zoho-solutions/?$                          { return 301 /zoho-automation-setup; }
    location ~ ^/hubspot-solutions/?$                       { return 301 /marketing-automation-agency; }
    location ~ ^/salesforce/?$                              { return 301 /marketing-automation-agency; }
    location ~ ^/(digital-marketing|web-development|marketing-automation|seo|social-media-management|ppc)-portfolio/?$ { return 301 /portfolio; }
    location ~ ^/careers-at-isuremedia/?$                   { return 301 /careers; }
    location ~ ^/gohighlevel-testimonials/?$                { return 301 /testimonials; }
    location ~ ^/get-in-touch/?$                            { return 301 /contact; }
    location ~ ^/hire-a-go-high-level-or-ghl-va/?$          { return 301 /hire-gohighlevel-expert; }
    location ~ ^/terms-and-conditions/?$                    { return 301 /terms; }
    location ~ ^/gdpr-usa-privacy-notice/?$                 { return 301 /gdpr; }
    location ~ ^/recurring-payments-terms/?$                { return 301 /terms; }

    location ~ ^/services/seo/technical-seo/?$                        { return 301 /technical-seo; }
    location ~ ^/services/seo/on-page-seo/?$                          { return 301 /on-page-seo-services; }
    location ~ ^/services/seo/local-seo/?$                            { return 301 /local-seo-services; }
    location ~ ^/services/seo/link-building/?$                        { return 301 /link-building-service; }
    location ~ ^/services/seo/ai-seo/?$                               { return 301 /ai-seo-services; }
    location ~ ^/services/seo/?$                                       { return 301 /seo-services; }
    location ~ ^/services/ppc/google-ads/?$                           { return 301 /google-ads-management; }
    location ~ ^/services/ppc/meta-ads/?$                             { return 301 /meta-ads-management; }
    location ~ ^/services/ppc/tiktok-ads/?$                           { return 301 /tiktok-ads-management; }
    location ~ ^/services/ppc/youtube-ads/?$                          { return 301 /youtube-ads-management; }
    location ~ ^/services/ppc-paid-marketing/?$                       { return 301 /ppc-marketing-agencies; }
    location ~ ^/services/content-creative/seo-blog-writing/?$        { return 301 /seo-content-writing-services; }
    location ~ ^/services/content-creative/graphic-design/?$          { return 301 /graphic-design-agency; }
    location ~ ^/services/content-creative/ad-creative-design/?$      { return 301 /ad-creative-design-services; }
    location ~ ^/services/content-creative/video-marketing/?$         { return 301 /video-editing-services; }
    location ~ ^/services/content-creative/brand-identity/?$          { return 301 /brand-identity-design-services; }
    location ~ ^/services/content-creative/?$                         { return 301 /content-marketing-and-creative-agency; }
    location ~ ^/services/white-label/white-label-seo/?$              { return 301 /white-label-seo-services; }
    location ~ ^/services/white-label/white-label-ppc/?$              { return 301 /white-label-ppc-services; }
    location ~ ^/services/white-label/white-label-web-design/?$       { return 301 /white-label-web-design-services; }
    location ~ ^/services/white-label/white-label-automation/?$       { return 301 /gohighlevel-white-label-support-services; }
    location ~ ^/services/white-label/dedicated-agency-pods/?$        { return 301 /dedicated-agency-pods; }
    location ~ ^/services/white-label/?$                              { return 301 /white-label-digital-marketing; }
    location ~ ^/services/websites-funnels/landing-pages/?$           { return 301 /landing-page-design-services; }
    location ~ ^/services/websites-funnels/gohighlevel-funnels/?$     { return 301 /gohighlevel-developer; }
    location ~ ^/services/websites-funnels/business-websites/?$       { return 301 /business-website-design-services; }
    location ~ ^/services/websites-funnels/gohighlevel-development/?$ { return 301 /gohighlevel-development-services; }
    location ~ ^/services/websites-funnels/wordpress/?$               { return 301 /wordpress-development-services; }
    location ~ ^/services/websites-funnels/shopify/?$                 { return 301 /shopify-development-services; }
    location ~ ^/services/websites-funnels/node/?$                    { return 301 /nodejs-development-services; }
    location ~ ^/services/websites-funnels/python/?$                  { return 301 /python-development-services; }
    location ~ ^/services/websites-funnels/php-laravel/?$             { return 301 /php-laravel-development; }
    location ~ ^/services/websites-funnels/ai-development/?$          { return 301 /ai-development-services; }
    location ~ ^/services/websites-funnels/clickfunnels/?$            { return 301 /clickfunnels-development; }
    location ~ ^/services/websites-funnels/kajabi/?$                  { return 301 /kajabi-website-development; }
    location ~ ^/services/websites-funnels/wix/?$                     { return 301 /wix-website-development; }
    location ~ ^/services/websites-funnels/sales-funnels/?$           { return 301 /sales-funnel-design; }
    location ~ ^/services/websites-funnels/?$                         { return 301 /websites-and-funnels; }
    location ~ ^/services/automation/gohighlevel/?$                   { return 301 /gohighlevel-automation-setup; }
    location ~ ^/services/automation/crm-setup/?$                     { return 301 /crm-setup-management; }
    location ~ ^/services/automation/zapier/?$                        { return 301 /zapier-workflow-automation; }
    location ~ ^/services/automation/make-integromat/?$               { return 301 /make-automation-services; }
    location ~ ^/services/automation/n8n/?$                           { return 301 /n8n-workflow-automation; }
    location ~ ^/services/automation/ai-chatbot/?$                    { return 301 /ai-chatbot-automation; }
    location ~ ^/services/automation/appointment-booking/?$           { return 301 /appointment-booking-automation; }
    location ~ ^/services/automation/lead-nurture-workflows/?$        { return 301 /lead-nurture-workflows; }
    location ~ ^/services/automation/sales-pipeline-automation/?$     { return 301 /sales-pipeline-automation; }
    location ~ ^/services/automation/email-marketing/?$               { return 301 /email-marketing-automation; }
    location ~ ^/services/automation/api-integration/?$               { return 301 /api-integration-services; }
    location ~ ^/services/automation/zoho/?$                          { return 301 /zoho-automation-setup; }
    location ~ ^/services/marketing-automation/?$                     { return 301 /marketing-automation-agency; }
    location ~ ^/hire/wordpress-developer/?$                          { return 301 /hire-wordpress-developer; }
    location ~ ^/hire/shopify-developer/?$                            { return 301 /hire-shopify-developer; }
    location ~ ^/hire/web-designer/?$                                 { return 301 /hire-web-designer; }
    location ~ ^/hire/seo-expert/?$                                   { return 301 /hire-seo-experts; }
    location ~ ^/hire/gohighlevel-expert/?$                           { return 301 /hire-gohighlevel-expert; }
    location ~ ^/hire/marketing-automation-expert/?$                  { return 301 /hire-marketing-automation-expert; }

    # Strip trailing slash so /page/ → /page → serves /page.html correctly.
    # Next.js static export generates flat .html files at the root level
    # alongside metadata directories that confuse nginx into returning 403.
    rewrite ^/(.+)/$ /$1 permanent;

    location / {
        try_files $uri $uri.html $uri/ @blogfallback;
    }

    location @blogfallback {
        return 302 https://blogs.isuremedia.com$uri;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    location /_next/static/ {
        add_header Cache-Control         "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }
    location ~* \.(webp|png|jpg|jpeg|svg|gif|ico|woff2?)$ {
        add_header Cache-Control         "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
}
