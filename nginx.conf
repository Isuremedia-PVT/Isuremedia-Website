    # ── Static export serves each route as /route/index.html ──
    # Try the exact file, then the directory's index.html, then fall
    # through to the old-blog-post fallback below.
    location / {
        try_files $uri $uri.html $uri/ @blogfallback;
    }

    # The old WordPress blog served every post at the site root with no
    # /blog/ prefix (e.g. /google-review-automation-gohighlevel-guide/),
    # and all of that content has since moved to blogs.isuremedia.com.
    # There's no practical way to list every historical post slug, so
    # any path that isn't a real page on this site falls through here
    # and gets redirected to the same path on the blog subdomain instead
    # of showing this site's own 404. A genuinely broken/mistyped link
    # will land on blogs.isuremedia.com's own 404 page as a result.
    location @blogfallback {
        return 404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # ── Cache hashed build assets aggressively, HTML not at all ──
    location /_next/static/ {
        add_header Cache-Control         "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }
    location ~* \.(webp|png|jpg|jpeg|svg|gif|ico|woff2?)$ {
        add_header Cache-Control         "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
}
