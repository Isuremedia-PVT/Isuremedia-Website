server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Redirects that used to live in next.config.ts's redirects() ──
    # output:"export" doesn't support redirects()/rewrites()/headers() at
    # all (Next.js just silently drops them, no build error), so these
    # three now live here instead.
    location = /blog {
        return 302 https://blog.isuremedia.com;
    }
    location /blog/ {
        rewrite ^/blog/(.*)$ https://blog.isuremedia.com/$1 redirect;
    }
    location = /freetools {
        return 302 https://templates.isuremedia.com/;
    }

    # ── Static export serves each route as /route/index.html ──
    # Try the exact file, then the directory's index.html, then fall
    # through to the custom 404 page Next generated at build time.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # ── Cache hashed build assets aggressively, HTML not at all ──
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ~* \.(webp|png|jpg|jpeg|svg|gif|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=604800";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
}
