# ── Redirect plain HTTP to HTTPS ──
# Cloudflare connects to origin on 443, but keeping port 80 open
# allows health checks and handles any direct HTTP hits.
server {
    listen 80;
    server_name isuremedia.com www.isuremedia.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name isuremedia.com www.isuremedia.com;
    root /usr/share/nginx/html;
    index index.html;

    # ── Cloudflare Origin Certificate ──
    # Generated in Cloudflare → SSL/TLS → Origin Server → Create Certificate
    # Valid 15 years, trusted only by Cloudflare (matches Full Strict mode).
    ssl_certificate     /etc/ssl/cloudflare/cert.pem;
    ssl_certificate_key /etc/ssl/cloudflare/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # ── Security headers ──
    add_header X-Frame-Options          "SAMEORIGIN"                       always;
    add_header X-Content-Type-Options   "nosniff"                          always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin"  always;
    add_header Permissions-Policy       "geolocation=(), camera=(), microphone=()" always;

    # ── Redirects that used to live in next.config.ts's redirects() ──
    # output:"export" doesn't support redirects()/rewrites()/headers() at
    # all (Next.js just silently drops them, no build error), so these
    # three now live here instead.
    location = /blog {
        return 302 https://blogs.isuremedia.com;
    }
    location /blog/ {
        rewrite ^/blog/(.*)$ https://blogs.isuremedia.com/$1 redirect;
    }
    location = /freetools {
        return 302 https://templates.isuremedia.com/;
    }

